services:
  #Base Postgress-DAtabase for store all data about alerts, metrics, and other info
  db:
    image: postgres:15-alpine
    container_name: sentinel-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentinel_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d sentinel_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  #Redis fast cache and other status info
  redis:
    image: redis:7-alpine
    container_name: sentinel-redis
    ports:
      - "6337:6379"

